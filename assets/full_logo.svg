<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 124" width="828" height="124"
     role="img" aria-label="WOK">
  <title>WOK horizontal lockup</title>
  <!--
    Mark left, wordmark right. The mark never sits inside the word.

    Proportions: mark ink height = 1.24x wordmark cap height; gap = 0.30x mark
    ink height; the mark's ink CENTRE aligns to the wordmark's CAP centre, not
    to the baseline. Ink fills the viewBox exactly.

    The wordmark is Syne 800 (the site's display face) converted to outlines.
    No live text, no font dependency, nothing to re-flow on a machine without
    Syne installed. Tracking is -0.012em to match Wordmark.module.css, then two
    pairs are kerned by hand: W|O by -0.035em and O|K by -0.055em. Without those
    the O|K gap opens up badly, because Syne's O is round on the right and its K
    starts on a flat stem, so the two sidebearings stack.
  -->
  <g transform="translate(0 0) scale(0.18619)" fill="#FBC02D" stroke="#FBC02D">
    <g>
      <path stroke="none" d="M162 0C238 0 290 52 285 132C278 200 120 353 94 472L166 574C120 588 35 590 35 576C35 562 27 555 26 546C10 496 0 390 0 300C1 198 4 100 36 58C72 16 117 0 162 0Z"/>
      <path fill="none" stroke-width="181" stroke-linecap="round" d="M453 160L128 575"/>
      <path fill="none" stroke-width="112" stroke-linecap="round" d="M670 220Q505 363 371 537"/>
    </g>  </g>
