name: Build WOK Client release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: wok-client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install source dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate source
        run: pnpm run validate

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact_name: windows-x64
          - os: ubuntu-latest
            arch: x64
            artifact_name: linux-x64
          - os: macos-latest
            arch: arm64
            artifact_name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install NSIS
        if: runner.os == 'Windows'
        uses: negrutiu/nsis-install@f3339c88dba6fd08910d5275a943f8f746d94876 # v2
        with:
          distro: official

      - name: Install AppImage build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and verified patched Electron
        run: pnpm install --frozen-lockfile

      - name: Build platform package
        run: pnpm run make -- --arch=${{ matrix.arch }}

      - name: Upload platform package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wok-client-${{ matrix.artifact_name }}
          path: dist/make/**
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat > release-notes.txt <<'EOF'
          WOK Client 1.0.0 is the first public WOK release.

          Included platforms:
          - Windows x64 installer
          - Linux x64 AppImage
          - macOS arm64 DMG

          These binaries are unsigned and the Linux and macOS packages have not yet received native gameplay smoke testing. Treat this as an early prerelease and verify SHA256SUMS.txt before use.

          WOK Client is an independent GPL-3.0 project based on Crankshaft. It is not affiliated with, endorsed by, or approved by FRVR. Performance results vary by hardware, drivers, thermals, game updates, and scene complexity. Terms-sensitive legacy features remain disabled by default.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --prerelease
          gh release edit "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "WOK Client 1.0.0" \
            --notes-file release-notes.txt
          while IFS= read -r -d '' file; do
            gh release upload "${GITHUB_REF_NAME}" "$file" --clobber
          done < <(find artifacts -type f -print0)
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber
